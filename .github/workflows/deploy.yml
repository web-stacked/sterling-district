name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-sterling-district
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write production Wrangler config
        env:
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
          CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME }}
        run: |
          test -n "$CF_KV_NAMESPACE_ID" || (echo "Missing repository variable CF_KV_NAMESPACE_ID" >&2; exit 1)
          test -n "$CF_R2_BUCKET_NAME" || (echo "Missing repository variable CF_R2_BUCKET_NAME" >&2; exit 1)
          cp wrangler.production.toml.example wrangler.production.toml
          sed -i "s/your-kv-namespace-id/${CF_KV_NAMESPACE_ID}/" wrangler.production.toml
          sed -i "s/your-r2-bucket-name/${CF_R2_BUCKET_NAME}/" wrangler.production.toml

      - name: Build and deploy
        run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
