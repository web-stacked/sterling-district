name = "sterling-district"
compatibility_date = "2026-06-25"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
binding = "ASSETS"
directory = "./dist"
not_found_handling = "404-page"

[observability]
enabled = true

[vars]
PUBLIC_CONTACT_FORM_ENDPOINT = "https://your-api.example.com/contact"
R2_PUBLIC_DOMAIN = "your-public-r2-domain.r2.dev"

[[kv_namespaces]]
binding = "CMS_KV"
id = "replace-with-caretcms-kv-namespace-id"

[[r2_buckets]]
binding = "CMS_R2"
bucket_name = "replace-with-caretcms-r2-bucket-name"
